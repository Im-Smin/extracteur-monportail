[project]
name = "extracteur-monportail"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
